<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Support Ticket Desk</title>
    <!-- Bootstrap v6.0.0-alpha.1 Minified CSS -->
    <!--<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css" integrity="sha384-BJf/nQgxZJU68GxBse97Vdlc8Rh+z9PzzXiS3/BjV+1nQPR7IKn+iJnD3DJvCMaU" crossorigin="anonymous">-->
    <style>
        {% include "ticketApp/bootstrap_styles.html" %}
    </style>
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container">
            <a class="navbar-brand" href="{% url 'index' %}">🎫 Support Portal</a>
            <div>
                {% if user.is_authenticated %}
                    <span class="text-white me-3">Hello, {{ user.username }}</span>
                    <a href="{% url 'create_ticket' %}" class="btn btn-primary btn-sm">New Ticket</a>
                <a href="{% url 'caller_intake' %}" class="btn btn-outline-info btn-sm me-auto">📞 Phone Intake Desk</a>

                {% else %}
                    <a href="/admin/login/" class="btn btn-outline-light btn-sm">Staff Login</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <div class="container">
        {% if messages %}
            {% for message in messages %}
                <div class="alert alert-success">{{ message }}</div>
            {% endfor %}
        {% endif %}
        {% block content %}{% endblock %}
    </div>
</body>
</html>
